<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Draggable Image Stack</title>

  <style>
    :root {
      --card-width: clamp(230px, 62vw, 390px);
      --radius: 22px;
      --stack-x: 13px;
      --stack-y: 10px;
      --shadow: 0 30px 70px rgba(0, 0, 0, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      touch-action: pan-y;
    }

    .image-stack-shell {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 500px;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
    }

    .image-stack {
      position: relative;
      width: min(100%, 720px);
      height: min(100%, 720px);
      display: grid;
      place-items: center;
    }

    .stack-card {
      position: absolute;
      width: var(--card-width);
      aspect-ratio: 5 / 7;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: var(--radius);
      overflow: hidden;
      background: #f4f4f4;
      box-shadow: var(--shadow);
      transform-origin: 50% 92%;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform;
      transition:
        transform 520ms cubic-bezier(.2, .8, .2, 1),
        box-shadow 220ms ease,
        opacity 220ms ease;
    }

    .stack-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .stack-card.is-top {
      cursor: grab;
      touch-action: none;
    }

    .stack-card.is-top:active {
      cursor: grabbing;
    }

    .stack-card.is-dragging {
      transition: box-shadow 120ms ease;
      box-shadow: 0 42px 90px rgba(0, 0, 0, 0.32);
    }

    .stack-card.is-exiting {
      opacity: 0;
      transition:
        transform 360ms cubic-bezier(.3, .7, .2, 1),
        opacity 260ms ease;
    }

    .stack-card:focus-visible {
      outline: 3px solid rgba(0, 0, 0, 0.85);
      outline-offset: 5px;
    }

    @media (max-width: 600px) {
      :root {
        --card-width: clamp(210px, 72vw, 315px);
        --stack-x: 9px;
        --stack-y: 8px;
        --radius: 18px;
      }

      .image-stack-shell {
        min-height: 430px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .stack-card,
      .stack-card.is-exiting {
        transition-duration: 1ms;
      }
    }
  </style>
</head>

<body>
  <main class="image-stack-shell" aria-label="Interactive photo stack">
    <section
      id="imageStack"
      class="image-stack"
      aria-label="Drag or swipe the front image to move it to the back"
    ></section>
  </main>

  <script>
    /*
      REPLACE THESE URLS WITH YOUR OWN PHOTOS.

      Use direct image URLs that begin with https:// and end in an image
      response. Wix-hosted image URLs, Cloudinary URLs, and most CDN image
      URLs work well.
    */
    const imageUrls = [
      "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=1200&q=90",
      "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1200&q=90",
      "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=1200&q=90",
      "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=1200&q=90",
      "https://images.unsplash.com/photo-1500648767791-00dcc994a43?auto=format&fit=crop&w=1200&q=90"
    ];

    const stack = document.getElementById("imageStack");

    const state = {
      cards: [],
      activeCard: null,
      pointerId: null,
      startX: 0,
      startY: 0,
      currentX: 0,
      currentY: 0,
      dragging: false,
      animating: false,
      threshold: 65
    };

    function createCards() {
      imageUrls.forEach((src, index) => {
        const card = document.createElement("article");
        card.className = "stack-card";
        card.setAttribute("aria-label", `Photo ${index + 1} of ${imageUrls.length}`);

        const img = document.createElement("img");
        img.src = src;
        img.alt = `Portfolio image ${index + 1}`;
        img.loading = index < 2 ? "eager" : "lazy";
        img.decoding = "async";
        img.draggable = false;

        card.appendChild(img);
        stack.appendChild(card);
        state.cards.push(card);
      });

      renderStack();
    }

    function getTiledTransform(index) {
      if (index === 0) {
        return "translate3d(0px, 0px, 0) rotate(0deg) scale(1)";
      }

      const x = index * -13;
      const y = index * -10;
      const rotation = -(2 + index * 2.7);
      const scale = Math.max(0.9, 1 - index * 0.012);

      return `translate3d(${x}px, ${y}px, 0) rotate(${rotation}deg) scale(${scale})`;
    }

    function renderStack() {
      state.cards.forEach((card, index) => {
        card.style.zIndex = String(100 - index);
        card.style.transform = getTiledTransform(index);
        card.classList.toggle("is-top", index === 0);
        card.classList.remove("is-dragging", "is-exiting");

        if (index === 0) {
          card.tabIndex = 0;
          card.setAttribute("aria-grabbed", "false");
        } else {
          card.tabIndex = -1;
          card.removeAttribute("aria-grabbed");
        }
      });
    }

    function onPointerDown(event, card) {
      const topCard = state.cards[0];

      if (
        state.animating ||
        card !== topCard ||
        !event.isPrimary
      ) {
        return;
      }

      state.activeCard = topCard;
      state.pointerId = event.pointerId;
      state.startX = event.clientX;
      state.startY = event.clientY;
      state.currentX = 0;
      state.currentY = 0;
      state.dragging = true;

      topCard.setPointerCapture(event.pointerId);
      topCard.classList.add("is-dragging");
      topCard.setAttribute("aria-grabbed", "true");
    }

    function onPointerMove(event) {
      if (
        !state.dragging ||
        !state.activeCard ||
        event.pointerId !== state.pointerId
      ) {
        return;
      }

      state.currentX = event.clientX - state.startX;
      state.currentY = event.clientY - state.startY;

      const rotation = Math.max(
        -13,
        Math.min(13, state.currentX * 0.035)
      );

      state.activeCard.style.transform =
        `translate3d(${state.currentX}px, ${state.currentY}px, 0) ` +
        `rotate(${rotation}deg) scale(1.035)`;
    }

    function onPointerUp(event) {
      if (
        !state.dragging ||
        !state.activeCard ||
        event.pointerId !== state.pointerId
      ) {
        return;
      }

      const card = state.activeCard;
      const distance = Math.hypot(state.currentX, state.currentY);

      state.dragging = false;
      card.classList.remove("is-dragging");
      card.setAttribute("aria-grabbed", "false");

      if (distance >= state.threshold) {
        sendTopCardToBack(card);
      } else {
        card.style.transform = getTiledTransform(0);
      }

      clearPointerState();
    }

    function clearPointerState() {
      state.activeCard = null;
      state.pointerId = null;
      state.currentX = 0;
      state.currentY = 0;
    }

    function sendTopCardToBack(card, forcedDirection = 0) {
      if (state.animating) return;

      state.animating = true;

      const horizontalDirection =
        forcedDirection ||
        (state.currentX === 0 ? 1 : Math.sign(state.currentX));

      const verticalCarry = Math.max(
        -180,
        Math.min(180, state.currentY * 1.3)
      );

      card.classList.add("is-exiting");
      card.style.transform =
        `translate3d(${horizontalDirection * 900}px, ${verticalCarry}px, 0) ` +
        `rotate(${horizontalDirection * 22}deg) scale(1.02)`;

      window.setTimeout(() => {
        state.cards.shift();
        state.cards.push(card);

        card.classList.remove("is-exiting");
        card.style.opacity = "1";
        renderStack();

        window.requestAnimationFrame(() => {
          state.animating = false;
        });
      }, 370);
    }

    function onKeyDown(event, card) {
      if (card !== state.cards[0] || state.animating) return;

      if (event.key === "ArrowLeft") {
        event.preventDefault();
        sendTopCardToBack(card, -1);
      }

      if (
        event.key === "ArrowRight" ||
        event.key === "Enter" ||
        event.key === " "
      ) {
        event.preventDefault();
        sendTopCardToBack(card, 1);
      }
    }

    stack.addEventListener("pointerdown", (event) => {
      const card = event.target.closest(".stack-card");
      if (card) onPointerDown(event, card);
    });

    stack.addEventListener("pointermove", onPointerMove);
    stack.addEventListener("pointerup", onPointerUp);
    stack.addEventListener("pointercancel", onPointerUp);

    stack.addEventListener("keydown", (event) => {
      const card = event.target.closest(".stack-card");
      if (card) onKeyDown(event, card);
    });

    createCards();
  </script>
</body>
</html>
