<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Missile Studios Image Stack</title>

  <style>
    :root {
      --card-width: clamp(220px, 64vw, 390px);
      --card-radius: 22px;
      --shadow: 0 28px 70px rgba(0, 0, 0, 0.24);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 460px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .stack {
      position: relative;
      width: min(100%, 720px);
      height: min(100%, 720px);
      display: grid;
      place-items: center;
    }

    .card {
      position: absolute;
      width: var(--card-width);
      aspect-ratio: 5 / 7;
      border-radius: var(--card-radius);
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: #eeeeee;
      box-shadow: var(--shadow);
      transform-origin: 50% 92%;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      will-change: transform, opacity;
      transition:
        transform 460ms cubic-bezier(.2, .8, .2, 1),
        opacity 260ms ease,
        box-shadow 180ms ease;
    }

    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .card.is-top {
      cursor: grab;
      touch-action: none;
    }

    .card.is-top:active {
      cursor: grabbing;
    }

    .card.is-dragging {
      transition: box-shadow 100ms ease;
      box-shadow: 0 38px 90px rgba(0, 0, 0, 0.34);
    }

    .card.is-exiting {
      opacity: 0;
      transition:
        transform 330ms cubic-bezier(.25, .7, .2, 1),
        opacity 240ms ease;
    }

    .controls {
      position: absolute;
      bottom: 22px;
      left: 50%;
      display: flex;
      gap: 10px;
      transform: translateX(-50%);
      z-index: 500;
    }

    .controls button {
      min-width: 52px;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: #111111;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      -webkit-tap-highlight-color: transparent;
    }

    .controls button:active {
      transform: scale(0.96);
    }

    @media (max-width: 600px) {
      :root {
        --card-width: clamp(205px, 72vw, 315px);
        --card-radius: 18px;
      }

      .stage {
        min-height: 420px;
      }

      .controls {
        bottom: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      .card.is-exiting {
        transition-duration: 1ms;
      }
    }
  </style>
</head>

<body>
  <main class="stage" aria-label="Interactive image stack">
    <section
      id="imageStack"
      class="stack"
      aria-label="Swipe, drag, tap, or use the buttons to move through the images"
    ></section>

    <div class="controls" aria-label="Image controls">
      <button id="previousButton" type="button" aria-label="Move top image left">←</button>
      <button id="nextButton" type="button" aria-label="Move top image right">→</button>
    </div>
  </main>

  <script>
    /*
      Replace these temporary photo URLs with your own direct image URLs.
    */
    const imageUrls = [
      "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=1200&q=90",
      "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1200&q=90",
      "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=1200&q=90",
      "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=1200&q=90",
      "https://images.unsplash.com/photo-1500648767791-00dcc994a43?auto=format&fit=crop&w=1200&q=90"
    ];

    const stack = document.getElementById("imageStack");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");

    const state = {
      cards: [],
      activeCard: null,
      dragging: false,
      animating: false,
      startX: 0,
      startY: 0,
      currentX: 0,
      currentY: 0,
      moved: false,
      threshold: 42
    };

    function tiledTransform(index) {
      if (index === 0) {
        return "translate3d(0px, 0px, 0) rotate(0deg) scale(1)";
      }

      const x = index * -13;
      const y = index * -10;
      const rotation = -(2 + index * 2.7);
      const scale = Math.max(0.9, 1 - index * 0.012);

      return `translate3d(${x}px, ${y}px, 0) rotate(${rotation}deg) scale(${scale})`;
    }

    function renderStack() {
      state.cards.forEach((card, index) => {
        card.style.zIndex = String(100 - index);
        card.style.opacity = "1";
        card.style.transform = tiledTransform(index);
        card.classList.toggle("is-top", index === 0);
        card.classList.remove("is-dragging", "is-exiting");
        card.setAttribute("aria-hidden", index === 0 ? "false" : "true");
      });
    }

    function beginDrag(card, x, y) {
      if (state.animating || card !== state.cards[0]) return;

      state.activeCard = card;
      state.dragging = true;
      state.startX = x;
      state.startY = y;
      state.currentX = 0;
      state.currentY = 0;
      state.moved = false;

      card.classList.add("is-dragging");
    }

    function continueDrag(x, y) {
      if (!state.dragging || !state.activeCard) return;

      state.currentX = x - state.startX;
      state.currentY = y - state.startY;

      if (Math.hypot(state.currentX, state.currentY) > 5) {
        state.moved = true;
      }

      const rotation = Math.max(-14, Math.min(14, state.currentX * 0.04));

      state.activeCard.style.transform =
        `translate3d(${state.currentX}px, ${state.currentY}px, 0) ` +
        `rotate(${rotation}deg) scale(1.04)`;
    }

    function finishDrag() {
      if (!state.dragging || !state.activeCard) return;

      const card = state.activeCard;
      const distance = Math.hypot(state.currentX, state.currentY);

      state.dragging = false;
      state.activeCard = null;
      card.classList.remove("is-dragging");

      if (distance >= state.threshold) {
        const direction = state.currentX === 0 ? 1 : Math.sign(state.currentX);
        sendCardToBack(card, direction, state.currentY);
      } else {
        card.style.transform = tiledTransform(0);

        if (!state.moved) {
          sendCardToBack(card, 1, 0);
        }
      }
    }

    function sendCardToBack(card, direction, verticalOffset) {
      if (state.animating || card !== state.cards[0]) return;

      state.animating = true;
      card.classList.add("is-exiting");

      const safeVerticalOffset = Math.max(
        -180,
        Math.min(180, verticalOffset * 1.2)
      );

      card.style.transform =
        `translate3d(${direction * 900}px, ${safeVerticalOffset}px, 0) ` +
        `rotate(${direction * 22}deg) scale(1.02)`;

      window.setTimeout(() => {
        state.cards.shift();
        state.cards.push(card);
        renderStack();

        window.requestAnimationFrame(() => {
          state.animating = false;
        });
      }, 350);
    }

    function createCard(src, index) {
      const card = document.createElement("article");
      card.className = "card";
      card.setAttribute("aria-label", `Photo ${index + 1} of ${imageUrls.length}`);

      const image = document.createElement("img");
      image.src = src;
      image.alt = `Portfolio image ${index + 1}`;
      image.loading = index < 2 ? "eager" : "lazy";
      image.decoding = "async";
      image.draggable = false;

      card.appendChild(image);

      card.addEventListener("touchstart", (event) => {
        if (event.touches.length !== 1) return;
        event.preventDefault();

        const touch = event.touches[0];
        beginDrag(card, touch.clientX, touch.clientY);
      }, { passive: false });

      card.addEventListener("touchmove", (event) => {
        if (event.touches.length !== 1 || !state.dragging) return;
        event.preventDefault();

        const touch = event.touches[0];
        continueDrag(touch.clientX, touch.clientY);
      }, { passive: false });

      card.addEventListener("touchend", (event) => {
        event.preventDefault();
        finishDrag();
      }, { passive: false });

      card.addEventListener("touchcancel", finishDrag, { passive: true });

      card.addEventListener("mousedown", (event) => {
        event.preventDefault();
        beginDrag(card, event.clientX, event.clientY);
      });

      return card;
    }

    imageUrls.forEach((src, index) => {
      const card = createCard(src, index);
      stack.appendChild(card);
      state.cards.push(card);
    });

    document.addEventListener("mousemove", (event) => {
      continueDrag(event.clientX, event.clientY);
    });

    document.addEventListener("mouseup", finishDrag);
    document.addEventListener("mouseleave", () => {
      if (state.dragging) finishDrag();
    });

    previousButton.addEventListener("click", () => {
      sendCardToBack(state.cards[0], -1, 0);
    });

    nextButton.addEventListener("click", () => {
      sendCardToBack(state.cards[0], 1, 0);
    });

    renderStack();
  </script>
</body>
</html>
